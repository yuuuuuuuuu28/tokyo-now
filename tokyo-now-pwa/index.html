const tabs=['本日','今月','鉄道','取得データ','重要度設定']; let active='本日'; let rawEvents=[]; let allEvents=[]; let sourceState={tokyo:{status:'wait',count:0,error:''},bigsight:{status:'wait',count:0,error:''},dome:{status:'wait',count:0,error:''}};
const els={list:document.getElementById('list'),tabs:document.getElementById('tabs'),status:document.getElementById('status'),dot:document.getElementById('dot'),hero:document.getElementById('hero')};
const pad=n=>String(n).padStart(2,'0'); const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; const today=()=>ymd(new Date());
function endOfMonth(){const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
function deepValues(obj,key,out=[]){if(!obj||typeof obj!=='object')return out;if(Array.isArray(obj)){obj.forEach(v=>deepValues(v,key,out));return out}for(const [k,v] of Object.entries(obj)){if(k===key)out.push(v);deepValues(v,key,out)}return out}
function stringsFrom(v){const out=[];(function walk(x){if(x==null)return;if(typeof x==='string'||typeof x==='number')out.push(String(x));else if(Array.isArray(x))x.forEach(walk);else if(typeof x==='object')Object.values(x).forEach(walk)})(v);return out}
function firstMeaningful(vals){for(const v of vals){for(const s0 of stringsFrom(v)){const s=s0.trim();if(s.length>1&&!['名称型','住所型','場所型','イベント型','イベントスケジュール型'].includes(s))return s}}return ''}
function extractTitle(o){const names=deepValues(o,'名称');for(const n of names){if(Array.isArray(n)){for(const x of n){if(x&&typeof x==='object'&&x['表記']&&String(x['表記']).trim())return String(x['表記']).trim()}}if(n&&typeof n==='object'&&n['表記'])return String(n['表記']).trim()}return firstMeaningful(deepValues(o,'表記'))||'名称未設定'}
function parseDateAny(s,baseYear=new Date().getFullYear()){s=String(s||'').trim();let m=s.match(/(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/(\d{1,2})月\s*(\d{1,2})日/);if(m)return `${baseYear}-${pad(+m[1])}-${pad(+m[2])}`;return ''}
function extractDates(o){let arr=[];for(const k of ['開始日','終了日','開催日'])arr.push(...deepValues(o,k).flatMap(v=>stringsFrom(v)));return [...new Set(arr.map(s=>parseDateAny(s)).filter(Boolean))]}
function extractPlace(o){const places=deepValues(o,'開催場所');for(const p of places){const s=firstMeaningful([...deepValues(p,'表記'),...deepValues(p,'住所')]);if(s)return s}return firstMeaningful(deepValues(o,'住所'))||'場所情報なし'}
function extractDesc(o){return firstMeaningful(deepValues(o,'説明'))||'説明情報なし'}
function extractUrl(o){return [...deepValues(o,'参照'),...deepValues(o,'URL'),...deepValues(o,'url')].flatMap(v=>stringsFrom(v)).find(s=>/^https?:\/\//.test(s))||''}
function normalizeTokyo(o,i){const dates=extractDates(o);return {id:`tokyo-${i}`,title:extractTitle(o),startDate:dates[0]||'',endDate:dates[1]||dates[0]||'',place:extractPlace(o),area:'',desc:extractDesc(o),url:extractUrl(o),source:'東京都Event API',sourceUpdated:'',importance:1,raw:o}}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
function headerIndex(headers,patterns){return headers.findIndex(h=>patterns.some(p=>p.test(String(h).replace(/\s/g,''))))}
function normalizeBigSight(text){const rows=parseCSV(text);if(rows.length<2)return[];const h=rows[0].map(x=>String(x).trim());const idx={title:headerIndex(h,[/催事名/,/イベント名/,/^名称$/, /展示会名/]),start:headerIndex(h,[/開始日/,/開催開始/,/会期.*開始/,/^開始$/]),end:headerIndex(h,[/終了日/,/開催終了/,/会期.*終了/,/^終了$/]),date:headerIndex(h,[/開催日/,/会期/,/日程/]),place:headerIndex(h,[/会場/,/開催場所/,/ホール/]),url:headerIndex(h,[/URL/i,/リンク/,/ホームページ/])};
  return rows.slice(1).map((r,i)=>{const raw=Object.fromEntries(h.map((k,j)=>[k,r[j]||'']));const title=(idx.title>=0?r[idx.title]:'')||r.find(x=>String(x).trim().length>4)||'名称未設定';let start=idx.start>=0?parseDateAny(r[idx.start]):'',end=idx.end>=0?parseDateAny(r[idx.end]):'';if(!start&&idx.date>=0){const ds=String(r[idx.date]||'');const matches=[...ds.matchAll(/(?:20\d{2}[\/.-])?\d{1,2}[\/.-]\d{1,2}|(?:20\d{2}年)?\d{1,2}月\d{1,2}日/g)].map(m=>parseDateAny(m[0])).filter(Boolean);start=matches[0]||'';end=matches[1]||start}if(!end)end=start;return{id:`bigsight-${i}`,title:String(title).trim(),startDate:start,endDate:end,place:idx.place>=0?(r[idx.place]||'東京ビッグサイト'):'東京ビッグサイト',area:'江東区有明',desc:'東京ビッグサイト公式オープンデータ掲載イベント',url:idx.url>=0?(r[idx.url]||''):'',source:'東京ビッグサイト オープンデータ',sourceUpdated:'2026-08-25',importance:3,raw}}).filter(x=>x.title&&x.title!=='名称未設定')}
const DEFAULT_WEIGHTS={venueScale:3,duration:2,eventType:2,timing:1,attendance:3,confidence:1};
let importanceWeights=(()=>{try{return {...DEFAULT_WEIGHTS,...JSON.parse(localStorage.getItem('tokyonow-importance')||'{}')}}catch{return {...DEFAULT_WEIGHTS}}})();
function daysBetween(a,b){if(!a)return 1;const x=new Date(a+'T00:00:00'),y=new Date((b||a)+'T00:00:00');return Math.max(1,Math.round((y-x)/86400000)+1)}
function importanceFactors(x){const d=daysBetween(x.startDate,x.endDate);return {venueScale:x.place==='東京ドーム'?5:x.place.includes('東京ビッグサイト')?4:1,duration:d===1?5:d<=3?4:d<=7?3:d<=14?2:1,eventType:/コンサート|ライブ|野球|スポーツ|展示会|総合展|フェス/i.test((x.category||'')+' '+x.title)?5:3,timing:x.startTime&&parseInt(x.startTime)>=17?5:3,attendance:x.attendanceScore||0,confidence:x.source.includes('公式')||x.source.includes('オープンデータ')?5:3}}
function importanceScoreSingle(x){const f=importanceFactors(x);let sum=0,max=0;for(const [k,w] of Object.entries(importanceWeights)){if(f[k]>0){sum+=f[k]*w;max+=5*w}}return max?Math.round(sum/max*100):0}
function importanceScore(x){return Math.max(...[x,...(x.relatedEvents||[])].map(importanceScoreSingle))}
function importanceLabel(x){const n=importanceScore(x);return n>=80?'🔥 大規模':n>=60?'● 注目':n>=40?'注目候補':'通常'}
function normalizeTokyoDomePayload(payload){
  const rows=Array.isArray(payload)?payload:(payload?.events||[]);
  return rows.map((x,i)=>({
    id:x.id||`dome-${x.startDate||'unknown'}-${i}`,title:x.title||'東京ドームイベント',

function normalizeTitleForGroup(title){
  return String(title||'')
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[「」『』【】()（）\[\]［］・･,，.。:：;；!！?？'\"“”‘’\-–—_／/\\|｜\s]/g,'')
    .replace(/第\s*\d+\s*回/g,'')
    .replace(/vol\.?\s*\d+/gi,'')
    .replace(/part\s*\d+/gi,'')
    .trim();
}
function venueFamily(place){
  const s=String(place||'').normalize('NFKC');
  if(s.includes('東京ビッグサイト'))return '東京ビッグサイト';
  if(s.includes('東京ドーム'))return '東京ドーム';
  return s.replace(/[\s　]/g,'').replace(/ホール|展示棟|展示場|会議棟/g,'');
}
function rangeOverlap(a,b){
  if(!a.startDate||!b.startDate)return false;
  const as=a.startDate,ae=a.endDate||a.startDate,bs=b.startDate,be=b.endDate||b.startDate;
  return as<=be&&bs<=ae;
}
function bigrams(s){const out=new Set();for(let i=0;i<s.length-1;i++)out.add(s.slice(i,i+2));return out}
function titleSimilarity(a,b){
  const x=normalizeTitleForGroup(a),y=normalizeTitleForGroup(b);
  if(!x||!y)return 0;
  if(x===y)return 1;
  const shorter=x.length<=y.length?x:y,longer=x.length<=y.length?y:x;
  if(shorter.length>=8&&longer.includes(shorter))return Math.min(0.99,0.82+0.17*(shorter.length/longer.length));
  if(shorter.length<6)return 0;
  const A=bigrams(x),B=bigrams(y);let hit=0;A.forEach(v=>{if(B.has(v))hit++});
  const union=new Set([...A,...B]).size;
  return union?hit/union:0;
}
function areRelatedEvents(a,b){
  if(venueFamily(a.place)!==venueFamily(b.place))return false;
  if(!rangeOverlap(a,b))return false;
  const sim=titleSimilarity(a.title,b.title);
  if(sim>=0.72)return true;
  const x=normalizeTitleForGroup(a.title),y=normalizeTitleForGroup(b.title);
  const shorter=x.length<=y.length?x:y,longer=x.length<=y.length?y:x;
  return shorter.length>=10&&longer.includes(shorter);
}
function pickMainEvent(group){
  return group.slice().sort((a,b)=>{
    const ac=normalizeTitleForGroup(a.title),bc=normalizeTitleForGroup(b.title);
    const aContained=group.filter(x=>normalizeTitleForGroup(x.title)!==ac&&normalizeTitleForGroup(x.title).includes(ac)).length;
    const bContained=group.filter(x=>normalizeTitleForGroup(x.title)!==bc&&normalizeTitleForGroup(x.title).includes(bc)).length;
    if(bContained!==aContained)return bContained-aContained;
    if(ac.length!==bc.length)return ac.length-bc.length;
    return String(a.title).length-String(b.title).length;
  })[0];
}
function groupRelatedEvents(events){
  const n=events.length,parent=Array.from({length:n},(_,i)=>i);
  const find=i=>{while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i]}return i};
  const unite=(a,b)=>{a=find(a);b=find(b);if(a!==b)parent[b]=a};
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)if(areRelatedEvents(events[i],events[j]))unite(i,j);
  const groups=new Map();
  events.forEach((e,i)=>{const r=find(i);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(e)});
  return [...groups.values()].map(group=>{
    const main=pickMainEvent(group);
    const related=group.filter(x=>x!==main).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')||a.title.localeCompare(b.title,'ja'));
    return {...main,relatedEvents:related,groupSize:group.length};
  });
}

function overlaps(event, start, end){
  if(!event.startDate) return false;
  const eventStart = event.startDate;
  const eventEnd = event.endDate || event.startDate;
  return eventStart <= end && eventEnd >= start;
}

  const normal=railDemoData.filter(x=>x.status===RAIL_STATUS.NORMAL);
  els.list.innerHTML=`<div class="demoNote"><b>v0.07.0 鉄道運行情報基盤（デモ表示）</b><br>この版は画面・データ構造の確認用です。実際の運行情報ではありません。v0.07.1以降で実データ接続へ進みます。</div>`;
  abnormal.forEach(x=>{const c=document.createElement('div');c.className='railCard';c.innerHTML=`<div class="railHead"><div><div class="railName">${escapeHtml(x.line)}</div><div class="railCompany">${escapeHtml(x.company)}</div></div><span class="railStatus ${railStatusClass(x.status)}">${escapeHtml(x.status)}</span></div><div class="railBody">${x.cause?`原因：${escapeHtml(x.cause)}<br>`:''}${x.section?`影響区間：${escapeHtml(x.section)}<br>`:''}${x.direction?`方向：${escapeHtml(x.direction)}`:''}</div><div class="railUpdated">更新 ${escapeHtml(x.updated)} ・ 情報元：${escapeHtml(x.source)}</div>`;els.list.appendChild(c)});
  const normalBox=document.createElement('div');normalBox.className='railNormal';normalBox.textContent=`その他平常運転 ${normal.length}路線`;els.list.appendChild(normalBox);
}

function dataForActive(){if(active==='取得データ')return allEvents.slice();const s=today(),e=active==='本日'?s:endOfMonth();return allEvents.filter(x=>overlaps(x,s,e)).sort((a,b)=>(a.startDate||'9999').localeCompare(b.startDate||'9999')||importanceScore(b)-importanceScore(a))}
function renderTabs(){els.tabs.innerHTML='';tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t===active?' active':'');b.textContent=t;b.onclick=()=>{active=t;renderTabs();renderHero();renderList()};els.tabs.appendChild(b)})}
function sourceBadge(label,state){const mark=state.status==='ok'?'🟢':state.status==='empty'?'🟡':state.status==='err'?'🔴':'⚪';const detail=state.status==='err'?`取得失敗${state.error?` (${state.error})`:''}`:`${state.count}件`;return `<span class="sourcePill">${mark} ${label} ${escapeHtml(detail)}</span>`}
function renderHero(){if(active==='鉄道'){const abnormal=railDemoData.filter(x=>x.status!==RAIL_STATUS.NORMAL).length;const normal=railDemoData.length-abnormal;els.hero.innerHTML=`<strong>鉄道運行情報</strong><small>異常路線のみ個別表示し、平常運転はまとめて表示します。<br>現在はv0.07.0のデモデータでUIと共通データ構造を確認中です。</small><div class="railSummary"><span class="railStat bad">異常 ${abnormal}路線</span><span class="railStat ok">その他平常運転 ${normal}路線</span></div>`;return}const range=active==='本日'?today():active==='今月'?`${today()}〜${endOfMonth()}`:active==='取得データ'?'全取得データ':'ユーザー設定';const grouped=rawEvents.length&&allEvents.length<rawEvents.length?`<br>${rawEvents.length}件の取得データを、親イベント＋サブイベント構造で${allEvents.length}件に整理しています。`:'';els.hero.innerHTML=`<strong>${active==='本日'?'本日のイベント':active==='今月'?'今月のこれから':active==='取得データ'?'取得データ':'重要度設定'}</strong><small>対象期間：${range}<br>過去イベントは「本日」「今月」には表示しません。将来の期間指定に対応できる期間フィルター方式です。${grouped}</small><div class="sourceLine">${sourceBadge('東京ビッグサイト',sourceState.bigsight)}${sourceBadge('東京ドーム',sourceState.dome)}${sourceBadge('東京都Event API',sourceState.tokyo)}</div>`}
function renderList(){if(active==='鉄道'){renderRail();return}if(active==='重要度設定'){renderImportanceSettings();return}const data=dataForActive();els.list.className='';els.list.innerHTML='';if(!data.length){els.list.innerHTML=`<div class="empty"><b>${active==='本日'?'本日の':active==='今月'?'今月これからの':'表示可能な'}イベントは見つかりませんでした</b><br><br>データ取得状況は上部の件数で確認できます。</div>`;return}data.slice(0,120).forEach(x=>{const c=document.createElement('div');c.className='card';const isToday=overlaps(x,today(),today());const futureMonth=overlaps(x,today(),endOfMonth());const badge=active==='取得データ'?(isToday?'<div class="badge today">本日</div>':futureMonth?'<div class="badge month">今月</div>':'<div class="badge">取得データ</div>'):`<div class="badge ${isToday?'today':'month'}">${isToday?'本日':'今月'}</div>`;const groupBadge=x.relatedEvents?.length?`<div class="badge groupBadge">＋${x.relatedEvents.length} サブイベント</div>`:'';c.innerHTML=`<div class="row"><div>${badge}<div class="badge high">${importanceLabel(x)} ${importanceScore(x)}</div>${groupBadge}<div class="title">${escapeHtml(x.title)}</div>${x.relatedEvents?.length?`<div class="groupInfo">関連タイトルは詳細で確認できます</div>`:''}<div class="meta">${escapeHtml(x.place||'場所情報なし')}<br>${formatRange(x)}<br>情報元：${escapeHtml(x.source)}</div></div><div class="chev">›</div></div>`;c.onclick=()=>openDetail(x);els.list.appendChild(c)})}
function formatRange(x){if(!x.startDate)return'日付情報なし';return x.endDate&&x.endDate!==x.startDate?`${x.startDate} ～ ${x.endDate}`:x.startDate}
function escapeHtml(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function openDetail(x){
  const mapUrl=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.place||x.title)}`;
  const related=x.relatedEvents||[];
  const relatedHtml=related.length?`<div class="relatedBox"><h3>このイベント内のサブタイトル・関連イベント（${related.length}件）</h3><div class="note">一覧ではメインイベントだけを表示し、同じ会場・開催期間・タイトル系列のイベントをここにまとめています。</div>${related.map(r=>`<div class="relatedItem"><div class="relatedTitle">${escapeHtml(r.title)}</div><div class="relatedMeta">${escapeHtml(r.place||x.place)}<br>${escapeHtml(formatRange(r))}<br>情報元：${escapeHtml(r.source)}</div>${r.url&&/^https?:\/\//.test(r.url)?`<a class="link" target="_blank" rel="noopener" href="${r.url}">このサブイベントの参照元</a>`:''}</div>`).join('')}</div>`:'';
  document.getElementById('detail').innerHTML=`<div class="badge">${escapeHtml(x.source)}</div>${related.length?`<div class="badge groupBadge">親イベント＋${related.length}サブイベント</div>`:''}<h2>${escapeHtml(x.title)}</h2><div class="meta">場所：${escapeHtml(x.place)}<br>期間：${escapeHtml(formatRange(x))}${x.area?`<br>エリア：${escapeHtml(x.area)}`:''}${x.sourceUpdated?`<br>データ更新：${escapeHtml(x.sourceUpdated)}`:''}<br>重要度：${importanceLabel(x)} ${importanceScore(x)}</div><p>${escapeHtml(x.desc)}</p><a class="mapLink" target="_blank" rel="noopener" href="${mapUrl}">Googleマップで会場を見る</a>${x.url&&/^https?:\/\//.test(x.url)?`<br><a class="link" target="_blank" rel="noopener" href="${x.url}">メインイベントの参照元を開く</a>`:''}${relatedHtml}`;
  document.getElementById('modal').classList.add('show');
}
function renderImportanceSettings(){els.list.className='';const labels={venueScale:'会場規模',duration:'開催日数',eventType:'イベント種別',timing:'開催・終了時間',attendance:'来場規模（取得できる場合）',confidence:'情報の確度'};els.list.innerHTML=`<div class="hero"><strong>重要度カスタマイズ</strong><small>各項目をどれだけ重視するか設定します。0=無視、5=最重視。評価項目は今後追加できる構造です。</small>${Object.entries(labels).map(([k,l])=>`<div style="margin-top:14px"><b>${l}</b><div style="display:flex;gap:10px;align-items:center"><input style="flex:1" type="range" min="0" max="5" value="${importanceWeights[k]}" data-weight="${k}"><span id="w-${k}">${importanceWeights[k]}</span></div></div>`).join('')}<button class="refresh" id="resetWeights" style="margin-top:18px">標準設定に戻す</button></div>`;document.querySelectorAll('[data-weight]').forEach(el=>el.oninput=()=>{importanceWeights[el.dataset.weight]=+el.value;document.getElementById('w-'+el.dataset.weight).textContent=el.value;localStorage.setItem('tokyonow-importance',JSON.stringify(importanceWeights))});document.getElementById('resetWeights').onclick=()=>{importanceWeights={...DEFAULT_WEIGHTS};localStorage.setItem('tokyonow-importance',JSON.stringify(importanceWeights));renderImportanceSettings()}}
async function fetchTokyoDome(){try{const r=await fetch(TOKYODOME_API,{cache:'no-store'});let j=null;try{j=await r.json()}catch{}if(!r.ok)throw Error(j?.error||`HTTP ${r.status}`);const items=normalizeTokyoDomePayload(j);sourceState.dome={status:items.length?'ok':'empty',count:items.length,error:items.length?'':'解析0件'};return items}catch(e){console.warn('Tokyo Dome',e);sourceState.dome={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function fetchTokyo(){try{const r=await fetch(TOKYO_API,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();const rows=Array.isArray(j)?j:(j.items||j.data||[]);const items=rows.map(normalizeTokyo);sourceState.tokyo={status:items.length?'ok':'empty',count:items.length,error:''};return items}catch(e){console.warn('Tokyo API',e);sourceState.tokyo={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function fetchBigSight(){try{const r=await fetch(BIGSIGHT_CSV,{cache:'no-store'});if(!r.ok){let msg=`HTTP ${r.status}`;try{const j=await r.json();if(j.error)msg=j.error}catch{}throw Error(msg)}const text=await r.text();const items=normalizeBigSight(text);sourceState.bigsight={status:items.length?'ok':'empty',count:items.length,error:''};return items}catch(e){console.warn('BigSight CSV',e);sourceState.bigsight={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function loadEvents(){els.status.textContent='イベント情報を取得中…';els.dot.className='dot';els.list.className='loading';els.list.textContent='イベント情報を取得しています…';sourceState={tokyo:{status:'wait',count:0,error:''},bigsight:{status:'wait',count:0,error:''},dome:{status:'wait',count:0,error:''}};const [b,d,t]=await Promise.all([fetchBigSight(),fetchTokyoDome(),fetchTokyo()]);rawEvents=[...b,...d,...t];allEvents=groupRelatedEvents(rawEvents);const states=[sourceState.bigsight,sourceState.dome,sourceState.tokyo];const ok=states.filter(x=>x.status==='ok'||x.status==='empty').length;const err=states.filter(x=>x.status==='err').length;els.status.textContent=err===0?`3情報源 接続済み・${rawEvents.length}件取得 → ${allEvents.length}件に整理`:`${ok}情報源 接続済み・${rawEvents.length}件取得 → ${allEvents.length}件に整理`;els.dot.className=err===0?'dot ok':ok===1?'dot warn':'dot err';renderHero();renderList()}
document.getElementById('refresh').onclick=loadEvents;document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}tick();setInterval(tick,1000);let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'};if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}renderTabs();loadEvents();
</script></body></html>

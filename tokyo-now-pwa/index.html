<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>東京NOW</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
    header{position:sticky;top:0;background:#0f172a;color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));z-index:5}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px}.clock{font-variant-numeric:tabular-nums;font-size:14px;opacity:.9}
    .subhead{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 12px;border-bottom:1px solid #e5e7eb;position:sticky;top:58px;z-index:4}.status{display:flex;align-items:center;gap:8px;font-size:13px;color:#4b5563}.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}.dot.ok{background:#22c55e}.dot.warn{background:#f59e0b}.dot.err{background:#ef4444}.refresh{border:0;background:#e5e7eb;padding:8px 11px;border-radius:10px;font-weight:800}
    .tabs{display:flex;gap:8px;overflow:auto;padding:10px 12px 6px;background:#fff;border-bottom:1px solid #e5e7eb}.tab{border:0;border-radius:999px;padding:9px 13px;background:#e5e7eb;white-space:nowrap;font-weight:800}.tab.active{background:#111827;color:#fff}
    main{padding:10px 12px 84px}.hero{background:#fff;border-radius:16px;padding:14px;margin:10px 0;border:1px solid #e5e7eb}.hero strong{font-size:20px}.hero small{display:block;margin-top:6px;color:#6b7280;line-height:1.5}.sourceLine{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.sourcePill{font-size:11px;border-radius:999px;padding:5px 8px;background:#f3f4f6;color:#4b5563;font-weight:800}
    .card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef0f2}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:900;background:#e5e7eb;margin:0 6px 8px 0}.badge.today{background:#dcfce7;color:#166534}.badge.month{background:#dbeafe;color:#1d4ed8}.badge.high{background:#fee2e2;color:#991b1b}.title{font-size:17px;font-weight:900;margin-bottom:6px;line-height:1.35}.meta{font-size:14px;color:#4b5563;line-height:1.6}.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.chev{font-size:24px;color:#9ca3af}.empty{text-align:center;color:#6b7280;padding:34px 18px;line-height:1.7;background:#fff;border-radius:16px;margin-top:10px}.loading{text-align:center;padding:38px;color:#6b7280}.note{font-size:12px;color:#6b7280;line-height:1.55;margin-top:12px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.close{float:right;border:0;background:#e5e7eb;border-radius:999px;width:36px;height:36px;font-size:18px}.map{height:160px;border-radius:14px;background:linear-gradient(135deg,#dbeafe,#e5e7eb);display:grid;place-items:center;margin-top:12px;font-weight:800;color:#374151;text-align:center;padding:12px}.link{display:inline-block;margin-top:12px;color:#0369a1;font-weight:800;text-decoration:none}.install{position:fixed;left:12px;right:12px;bottom:12px;background:#111827;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:800;display:none;z-index:10}
  </style>
</head>
<body>
<header><div class="top"><div class="brand">東京NOW <span style="font-size:11px;opacity:.65">v0.05.1</span></div><div class="clock" id="clock"></div></div></header>
<div class="subhead"><div class="status"><span class="dot" id="dot"></span><span id="status">イベント情報を取得中…</span></div><button class="refresh" id="refresh">更新</button></div>
<div class="tabs" id="tabs"></div>
<main><div class="hero" id="hero"></div><div id="list" class="loading">イベント情報を取得しています…</div></main>
<button id="installBtn" class="install">ホーム画面に追加</button>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">×</button><div id="detail"></div></div></div>
<script>
const TOKYO_API='https://api.data.metro.tokyo.lg.jp/v1/Event';
const BIGSIGHT_CSV='/.netlify/functions/bigsight';
const TOKYODOME_HTML='/.netlify/functions/tokyodome';
const tabs=['本日','今月','取得データ','重要度設定']; let active='本日'; let allEvents=[]; let sourceState={tokyo:{status:'wait',count:0,error:''},bigsight:{status:'wait',count:0,error:''},dome:{status:'wait',count:0,error:''}};
const els={list:document.getElementById('list'),tabs:document.getElementById('tabs'),status:document.getElementById('status'),dot:document.getElementById('dot'),hero:document.getElementById('hero')};
const pad=n=>String(n).padStart(2,'0'); const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; const today=()=>ymd(new Date());
function endOfMonth(){const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+1,0))}
function deepValues(obj,key,out=[]){if(!obj||typeof obj!=='object')return out;if(Array.isArray(obj)){obj.forEach(v=>deepValues(v,key,out));return out}for(const [k,v] of Object.entries(obj)){if(k===key)out.push(v);deepValues(v,key,out)}return out}
function stringsFrom(v){const out=[];(function walk(x){if(x==null)return;if(typeof x==='string'||typeof x==='number')out.push(String(x));else if(Array.isArray(x))x.forEach(walk);else if(typeof x==='object')Object.values(x).forEach(walk)})(v);return out}
function firstMeaningful(vals){for(const v of vals){for(const s0 of stringsFrom(v)){const s=s0.trim();if(s.length>1&&!['名称型','住所型','場所型','イベント型','イベントスケジュール型'].includes(s))return s}}return ''}
function extractTitle(o){const names=deepValues(o,'名称');for(const n of names){if(Array.isArray(n)){for(const x of n){if(x&&typeof x==='object'&&x['表記']&&String(x['表記']).trim())return String(x['表記']).trim()}}if(n&&typeof n==='object'&&n['表記'])return String(n['表記']).trim()}return firstMeaningful(deepValues(o,'表記'))||'名称未設定'}
function parseDateAny(s,baseYear=new Date().getFullYear()){s=String(s||'').trim();let m=s.match(/(20\d{2})[\/.-](\d{1,2})[\/.-](\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/(20\d{2})年\s*(\d{1,2})月\s*(\d{1,2})日/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=s.match(/(\d{1,2})月\s*(\d{1,2})日/);if(m)return `${baseYear}-${pad(+m[1])}-${pad(+m[2])}`;return ''}
function extractDates(o){let arr=[];for(const k of ['開始日','終了日','開催日'])arr.push(...deepValues(o,k).flatMap(v=>stringsFrom(v)));return [...new Set(arr.map(s=>parseDateAny(s)).filter(Boolean))]}
function extractPlace(o){const places=deepValues(o,'開催場所');for(const p of places){const s=firstMeaningful([...deepValues(p,'表記'),...deepValues(p,'住所')]);if(s)return s}return firstMeaningful(deepValues(o,'住所'))||'場所情報なし'}
function extractDesc(o){return firstMeaningful(deepValues(o,'説明'))||'説明情報なし'}
function extractUrl(o){return [...deepValues(o,'参照'),...deepValues(o,'URL'),...deepValues(o,'url')].flatMap(v=>stringsFrom(v)).find(s=>/^https?:\/\//.test(s))||''}
function normalizeTokyo(o,i){const dates=extractDates(o);return {id:`tokyo-${i}`,title:extractTitle(o),startDate:dates[0]||'',endDate:dates[1]||dates[0]||'',place:extractPlace(o),area:'',desc:extractDesc(o),url:extractUrl(o),source:'東京都Event API',sourceUpdated:'',importance:1,raw:o}}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()))}
function headerIndex(headers,patterns){return headers.findIndex(h=>patterns.some(p=>p.test(String(h).replace(/\s/g,''))))}
function normalizeBigSight(text){const rows=parseCSV(text);if(rows.length<2)return[];const h=rows[0].map(x=>String(x).trim());const idx={title:headerIndex(h,[/催事名/,/イベント名/,/^名称$/, /展示会名/]),start:headerIndex(h,[/開始日/,/開催開始/,/会期.*開始/,/^開始$/]),end:headerIndex(h,[/終了日/,/開催終了/,/会期.*終了/,/^終了$/]),date:headerIndex(h,[/開催日/,/会期/,/日程/]),place:headerIndex(h,[/会場/,/開催場所/,/ホール/]),url:headerIndex(h,[/URL/i,/リンク/,/ホームページ/])};
  return rows.slice(1).map((r,i)=>{const raw=Object.fromEntries(h.map((k,j)=>[k,r[j]||'']));const title=(idx.title>=0?r[idx.title]:'')||r.find(x=>String(x).trim().length>4)||'名称未設定';let start=idx.start>=0?parseDateAny(r[idx.start]):'',end=idx.end>=0?parseDateAny(r[idx.end]):'';if(!start&&idx.date>=0){const ds=String(r[idx.date]||'');const matches=[...ds.matchAll(/(?:20\d{2}[\/.-])?\d{1,2}[\/.-]\d{1,2}|(?:20\d{2}年)?\d{1,2}月\d{1,2}日/g)].map(m=>parseDateAny(m[0])).filter(Boolean);start=matches[0]||'';end=matches[1]||start}if(!end)end=start;return{id:`bigsight-${i}`,title:String(title).trim(),startDate:start,endDate:end,place:idx.place>=0?(r[idx.place]||'東京ビッグサイト'):'東京ビッグサイト',area:'江東区有明',desc:'東京ビッグサイト公式オープンデータ掲載イベント',url:idx.url>=0?(r[idx.url]||''):'',source:'東京ビッグサイト オープンデータ',sourceUpdated:'2026-08-25',importance:3,raw}}).filter(x=>x.title&&x.title!=='名称未設定')}
const DEFAULT_WEIGHTS={venueScale:3,duration:2,eventType:2,timing:1,attendance:3,confidence:1};
let importanceWeights=(()=>{try{return {...DEFAULT_WEIGHTS,...JSON.parse(localStorage.getItem('tokyonow-importance')||'{}')}}catch{return {...DEFAULT_WEIGHTS}}})();
function daysBetween(a,b){if(!a)return 1;const x=new Date(a+'T00:00:00'),y=new Date((b||a)+'T00:00:00');return Math.max(1,Math.round((y-x)/86400000)+1)}
function importanceFactors(x){const d=daysBetween(x.startDate,x.endDate);return {venueScale:x.place==='東京ドーム'?5:x.place.includes('東京ビッグサイト')?4:1,duration:d===1?5:d<=3?4:d<=7?3:d<=14?2:1,eventType:/コンサート|ライブ|野球|スポーツ|展示会|総合展|フェス/i.test((x.category||'')+' '+x.title)?5:3,timing:x.startTime&&parseInt(x.startTime)>=17?5:3,attendance:x.attendanceScore||0,confidence:x.source.includes('公式')||x.source.includes('オープンデータ')?5:3}}
function importanceScore(x){const f=importanceFactors(x);let sum=0,max=0;for(const [k,w] of Object.entries(importanceWeights)){if(f[k]>0){sum+=f[k]*w;max+=5*w}}return max?Math.round(sum/max*100):0}
function importanceLabel(x){const n=importanceScore(x);return n>=80?'🔥 大規模':n>=60?'● 注目':n>=40?'注目候補':'通常'}
function normalizeTokyoDome(html){
  const doc=new DOMParser().parseFromString(html,'text/html');
  const body=(doc.body?.innerText||doc.body?.textContent||'').replace(/\r/g,'');
  const lines=body.split(/\n+/).map(x=>x.replace(/[\t ]+/g,' ').trim()).filter(Boolean);
  const out=[];let year=null,month=null;
  const ignore=/^(TOKYO DOME TOUR|お問い合わせ|新規入会|ログイン|チケプラ|ローチケ|DISK ?GARAGE|キョードー|TEL[:：]|平日 |土日祝 |〖|（営業時間)/i;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    const ym=line.match(/^(20\d{2})年(\d{1,2})月$/);if(ym){year=+ym[1];month=+ym[2];continue}
    if(!year||!month)continue;
    const dm=line.match(/^(\d{1,2})\s*[（(][^）)]*[）)]\s*(?:\||｜)?\s*(.*)$/);if(!dm)continue;
    const day=+dm[1];let rest=(dm[2]||'').trim();
    if(!rest){const nxt=lines[i+1]||'';if(!/^(\d{1,2})\s*[（(]/.test(nxt)&&!/^20\d{2}年\d{1,2}月$/.test(nxt))rest=nxt}
    if(!rest)continue;
    rest=rest.replace(/TOKYO DOME TOUR/g,' ').replace(/\s+/g,' ').trim();
    const category=(rest.match(/^(野球|コンサート|スポーツ|イベント)\s+/)||[])[1]||'';
    rest=rest.replace(/^(野球|コンサート|スポーツ|イベント)\s+/,'');
    rest=rest.replace(/^(野球|コンサート|スポーツ|イベント)\s+/,'');
    const title=rest.split(/\s+(?:開場|開始|開演)\s*\d{1,2}:\d{2}|\s*<お問い合わせ>|\s*お問い合わせ/)[0].trim();
    if(!title||ignore.test(title))continue;
    const open=(rest.match(/開場\s*(\d{1,2}:\d{2})/)||[])[1]||'';
    const start=(rest.match(/(?:開始|開演)\s*(\d{1,2}:\d{2})/)||[])[1]||'';
    const date=`${year}-${pad(month)}-${pad(day)}`;
    out.push({id:`dome-${date}-${out.length}`,title,startDate:date,endDate:date,startTime:start,openTime:open,place:'東京ドーム',area:'文京区後楽',category,desc:[open&&`開場 ${open}`,start&&`${category==='コンサート'||category==='イベント'?'開演':'開始'} ${start}`].filter(Boolean).join('／')||'東京ドーム公式スケジュール掲載イベント',url:'https://www.tokyo-dome.co.jp/dome/event/schedule.html',source:'東京ドーム公式',sourceUpdated:today(),attendanceScore:0,raw:{text:line}})
  }
  const seen=new Set();return out.filter(x=>{const k=x.startDate+'|'+x.title;if(seen.has(k))return false;seen.add(k);return true})
}
function dataForActive(){if(active==='取得データ')return allEvents.slice();const s=today(),e=active==='本日'?s:endOfMonth();return allEvents.filter(x=>overlaps(x,s,e)).sort((a,b)=>(a.startDate||'9999').localeCompare(b.startDate||'9999')||importanceScore(b)-importanceScore(a))}
function renderTabs(){els.tabs.innerHTML='';tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t===active?' active':'');b.textContent=t;b.onclick=()=>{active=t;renderTabs();renderHero();renderList()};els.tabs.appendChild(b)})}
function sourceBadge(label,state){const mark=state.status==='ok'?'🟢':state.status==='empty'?'🟡':state.status==='err'?'🔴':'⚪';const detail=state.status==='err'?`取得失敗${state.error?` (${state.error})`:''}`:`${state.count}件`;return `<span class="sourcePill">${mark} ${label} ${escapeHtml(detail)}</span>`}
function renderHero(){const range=active==='本日'?today():active==='今月'?`${today()}〜${endOfMonth()}`:active==='取得データ'?'全取得データ':'ユーザー設定';els.hero.innerHTML=`<strong>${active==='本日'?'本日のイベント':active==='今月'?'今月のこれから':active==='取得データ'?'取得データ':'重要度設定'}</strong><small>対象期間：${range}<br>過去イベントは「本日」「今月」には表示しません。将来の期間指定に対応できる期間フィルター方式です。</small><div class="sourceLine">${sourceBadge('東京ビッグサイト',sourceState.bigsight)}${sourceBadge('東京ドーム',sourceState.dome)}${sourceBadge('東京都Event API',sourceState.tokyo)}</div>`}
function renderList(){if(active==='重要度設定'){renderImportanceSettings();return}const data=dataForActive();els.list.className='';els.list.innerHTML='';if(!data.length){els.list.innerHTML=`<div class="empty"><b>${active==='本日'?'本日の':active==='今月'?'今月これからの':'表示可能な'}イベントは見つかりませんでした</b><br><br>データ取得状況は上部の件数で確認できます。</div>`;return}data.slice(0,120).forEach(x=>{const c=document.createElement('div');c.className='card';const isToday=overlaps(x,today(),today());const futureMonth=overlaps(x,today(),endOfMonth());const badge=active==='取得データ'?(isToday?'<div class="badge today">本日</div>':futureMonth?'<div class="badge month">今月</div>':'<div class="badge">取得データ</div>'):`<div class="badge ${isToday?'today':'month'}">${isToday?'本日':'今月'}</div>`;c.innerHTML=`<div class="row"><div>${badge}<div class="badge high">${importanceLabel(x)} ${importanceScore(x)}</div><div class="title">${escapeHtml(x.title)}</div><div class="meta">${escapeHtml(x.place||'場所情報なし')}<br>${formatRange(x)}<br>情報元：${escapeHtml(x.source)}</div></div><div class="chev">›</div></div>`;c.onclick=()=>openDetail(x);els.list.appendChild(c)})}
function formatRange(x){if(!x.startDate)return'日付情報なし';return x.endDate&&x.endDate!==x.startDate?`${x.startDate} ～ ${x.endDate}`:x.startDate}
function escapeHtml(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function openDetail(x){document.getElementById('detail').innerHTML=`<div class="badge">${escapeHtml(x.source)}</div><h2>${escapeHtml(x.title)}</h2><div class="meta">場所：${escapeHtml(x.place)}<br>期間：${escapeHtml(formatRange(x))}${x.area?`<br>エリア：${escapeHtml(x.area)}`:''}${x.sourceUpdated?`<br>データ更新：${escapeHtml(x.sourceUpdated)}`:''}</div><p>${escapeHtml(x.desc)}</p><div class="map">地図連携は次段階で実装</div>${x.url&&/^https?:\/\//.test(x.url)?`<a class="link" target="_blank" rel="noopener" href="${x.url}">参照元を開く</a>`:''}`;document.getElementById('modal').classList.add('show')}
function renderImportanceSettings(){els.list.className='';const labels={venueScale:'会場規模',duration:'開催日数',eventType:'イベント種別',timing:'開催・終了時間',attendance:'来場規模（取得できる場合）',confidence:'情報の確度'};els.list.innerHTML=`<div class="hero"><strong>重要度カスタマイズ</strong><small>各項目をどれだけ重視するか設定します。0=無視、5=最重視。評価項目は今後追加できる構造です。</small>${Object.entries(labels).map(([k,l])=>`<div style="margin-top:14px"><b>${l}</b><div style="display:flex;gap:10px;align-items:center"><input style="flex:1" type="range" min="0" max="5" value="${importanceWeights[k]}" data-weight="${k}"><span id="w-${k}">${importanceWeights[k]}</span></div></div>`).join('')}<button class="refresh" id="resetWeights" style="margin-top:18px">標準設定に戻す</button></div>`;document.querySelectorAll('[data-weight]').forEach(el=>el.oninput=()=>{importanceWeights[el.dataset.weight]=+el.value;document.getElementById('w-'+el.dataset.weight).textContent=el.value;localStorage.setItem('tokyonow-importance',JSON.stringify(importanceWeights))});document.getElementById('resetWeights').onclick=()=>{importanceWeights={...DEFAULT_WEIGHTS};localStorage.setItem('tokyonow-importance',JSON.stringify(importanceWeights));renderImportanceSettings()}}
async function fetchTokyoDome(){try{const r=await fetch(TOKYODOME_HTML,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const html=await r.text();const items=normalizeTokyoDome(html);sourceState.dome={status:items.length?'ok':'empty',count:items.length,error:''};return items}catch(e){console.warn('Tokyo Dome',e);sourceState.dome={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function fetchTokyo(){try{const r=await fetch(TOKYO_API,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const j=await r.json();const rows=Array.isArray(j)?j:(j.items||j.data||[]);const items=rows.map(normalizeTokyo);sourceState.tokyo={status:items.length?'ok':'empty',count:items.length,error:''};return items}catch(e){console.warn('Tokyo API',e);sourceState.tokyo={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function fetchBigSight(){try{const r=await fetch(BIGSIGHT_CSV,{cache:'no-store'});if(!r.ok){let msg=`HTTP ${r.status}`;try{const j=await r.json();if(j.error)msg=j.error}catch{}throw Error(msg)}const text=await r.text();const items=normalizeBigSight(text);sourceState.bigsight={status:items.length?'ok':'empty',count:items.length,error:''};return items}catch(e){console.warn('BigSight CSV',e);sourceState.bigsight={status:'err',count:0,error:e.message||'接続エラー'};return[]}}
async function loadEvents(){els.status.textContent='イベント情報を取得中…';els.dot.className='dot';els.list.className='loading';els.list.textContent='イベント情報を取得しています…';sourceState={tokyo:{status:'wait',count:0,error:''},bigsight:{status:'wait',count:0,error:''},dome:{status:'wait',count:0,error:''}};const [b,d,t]=await Promise.all([fetchBigSight(),fetchTokyoDome(),fetchTokyo()]);allEvents=[...b,...d,...t];const states=[sourceState.bigsight,sourceState.dome,sourceState.tokyo];const ok=states.filter(x=>x.status==='ok'||x.status==='empty').length;const err=states.filter(x=>x.status==='err').length;els.status.textContent=err===0?`3情報源 接続済み・${allEvents.length}件取得`:`${ok}情報源 接続済み・${allEvents.length}件取得`;els.dot.className=err===0?'dot ok':ok===1?'dot warn':'dot err';renderHero();renderList()}
document.getElementById('refresh').onclick=loadEvents;document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('show')};function tick(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date())}tick();setInterval(tick,1000);let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block'});document.getElementById('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'};if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}renderTabs();loadEvents();
</script></body></html>
